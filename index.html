<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ooredoo Outbound Call Trigger</title>
<style>
  :root{--red:#e60000;--ink:#1f2330;--mut:#6b7280;--line:#e5e7eb;--bg:#f6f7f9}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:100%;max-width:480px;overflow:hidden}
  header{background:var(--red);color:#fff;padding:20px 24px}
  header h1{margin:0;font-size:20px} header p{margin:4px 0 0;font-size:13px;opacity:.9}
  form{padding:24px;display:flex;flex-direction:column;gap:18px}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
  select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
  select:focus,input:focus{outline:2px solid var(--red);border-color:transparent}
  .hint{font-size:12px;color:var(--mut);margin-top:4px}
  .usecases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .uc{border:1.5px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:center;font-size:14px;font-weight:600;background:#fff}
  .uc small{display:block;font-weight:400;color:var(--mut);margin-top:3px}
  .uc.sel{border-color:var(--red);background:#fff1f1}
  .row{display:flex;gap:8px} .row input{flex:1}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;cursor:pointer;font-size:13px}
  button.go{background:var(--red);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
  button.go:disabled{opacity:.5;cursor:not-allowed}
  .hidden{display:none}
  #result{margin:0 24px 24px;padding:12px 14px;border-radius:10px;font-size:13px;white-space:pre-wrap;word-break:break-word}
  .ok{background:#ecfdf3;color:#05603a}.err{background:#fef3f2;color:#b42318}
</style>
</head>
<body>
<div class="card">
  <header><h1>Ooredoo Outbound Call Trigger</h1><p>Place a test outbound call from an AI agent</p></header>
  <form id="f">
    <div>
      <label for="entity">Ooredoo entity</label>
      <select id="entity" required><option value="" disabled selected>Select an entity…</option></select>
    </div>
    <div id="ucWrap" class="hidden">
      <label>Use case</label>
      <div class="usecases">
        <div class="uc" data-uc="payment" tabindex="0">Payment Reminder<small>Bill / payment follow-up</small></div>
        <div class="uc" data-uc="retention" tabindex="0">Retention Offer<small>Personalized win-back</small></div>
      </div>
    </div>
    <div id="inputs" class="hidden">
      <div style="margin-bottom:18px">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" placeholder="+97450000000" inputmode="tel" autocomplete="off" required>
        <div class="hint">International format with country code (E.164).</div>
      </div>
      <div>
        <label for="idem">Idempotency key</label>
        <div class="row"><input id="idem" placeholder="e.g. demo-001" maxlength="64" autocomplete="off" required><button type="button" class="ghost" id="gen">Generate</button></div>
        <div class="hint">Reusing a key will not place a duplicate call.</div>
      </div>
    </div>
    <button class="go hidden" id="go" type="submit">Trigger call</button>
  </form>
  <div id="result" class="hidden"></div>
</div>
<script>
const API = "https://obagcessyqdsbihnmeav.supabase.co/functions/v1/ooredoo-outbound-call";
const ENTITIES = {qatar:"Ooredoo Qatar",algeria:"Ooredoo Algeria",tunisia:"Ooredoo Tunisia",kuwait:"Ooredoo Kuwait",oman:"Ooredoo Oman",asiacell:"Asiacell (Iraq)",palestine:"Ooredoo Palestine"};
const $ = id => document.getElementById(id);
let useCase = null;
for (const [k,v] of Object.entries(ENTITIES)) $("entity").add(new Option(v,k));

function refresh(){
  $("ucWrap").classList.toggle("hidden", !$("entity").value);
  const ready = $("entity").value && useCase;
  $("inputs").classList.toggle("hidden", !ready);
  $("go").classList.toggle("hidden", !ready);
}
$("entity").addEventListener("change", ()=>{ useCase=null; document.querySelectorAll(".uc").forEach(e=>e.classList.remove("sel")); $("result").classList.add("hidden"); refresh(); });
document.querySelectorAll(".uc").forEach(el=>{
  const pick=()=>{ useCase=el.dataset.uc; document.querySelectorAll(".uc").forEach(e=>e.classList.toggle("sel",e===el)); refresh(); };
  el.addEventListener("click",pick); el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();} });
});
$("gen").addEventListener("click",()=>{ $("idem").value = ($("entity").value||"call")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); });

$("f").addEventListener("submit", async e=>{
  e.preventDefault();
  const phone = $("phone").value.replace(/[\s()-]/g,"");
  const res = $("result"); res.className=""; res.classList.remove("hidden");
  if(!/^\+[1-9]\d{7,14}$/.test(phone)){ res.className="err"; res.textContent="Enter the phone number in international format, e.g. +97450000000"; return; }
  $("go").disabled=true; $("go").textContent="Triggering…"; res.className="hidden";
  try{
    const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({entity:$("entity").value,useCase,phoneNumber:phone,idempotencyKey:$("idem").value.trim()})});
    const j = await r.json().catch(()=>({error:"Unexpected response"}));
    res.className = r.ok ? "ok":"err";
    res.textContent = (r.ok ? "✓ Call triggered\n":"✗ Failed ("+(j.status||r.status)+")\n") + JSON.stringify(j.data ?? j, null, 2);
  }catch(err){ res.className="err"; res.textContent="Network error: "+err.message; }
  $("go").disabled=false; $("go").textContent="Trigger call";
});
</script>
</body>
</html>
